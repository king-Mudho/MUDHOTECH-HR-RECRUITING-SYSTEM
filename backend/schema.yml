openapi: 3.0.3
info:
  title: MUDHOTECH HR RECRUITING SYSTEM API
  version: 1.0.0
  description: Multi-tenant ATS with explainable, human-controlled AI screening.
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Public API metadata including the authoritative server time (EC-OPS-06).
      summary: API metadata
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/v1/companies/{slug}/:
    get:
      operationId: companies_retrieve
      description: "\U0001F310 Public careers profile (FR-M02-01). Only active organisations
        are visible."
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - companies
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCompany'
          description: ''
  /api/v1/csrf/:
    get:
      operationId: auth_csrf
      description: Sets `csrftoken` (readable by JS) so the SPA can send `X-CSRFToken`
        on unsafe requests.
      summary: Set the CSRF cookie for the browser client
      tags:
      - csrf
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/invitations/{token}/:
    get:
      operationId: invitations_preview
      description: "\U0001F310 Invitation preview before sign-in (no token echo, masked
        email)."
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPublic'
          description: ''
  /api/v1/invitations/{token}/accept/:
    post:
      operationId: invitations_accept
      description: Accept an invitation as the signed-in, verified invitee (EC-ORG-04/05).
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
