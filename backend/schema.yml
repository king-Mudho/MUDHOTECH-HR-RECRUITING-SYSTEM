components:
  schemas:
    ActiveOrg:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
        role:
          type: string
      required:
      - organisation_id
      - role
    ActiveOrgRequest:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
      required:
      - organisation_id
    ApiRoot:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - name
      - server_time
      - version
    BlankEnum:
      enum:
      - ''
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    DepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - name
    DuplicatePolicyEnum:
      enum:
      - one_active
      - allow_resubmit_replace
      - allow_multiple
      type: string
      description: |-
        * `one_active` - One active application per vacancy
        * `allow_resubmit_replace` - Resubmit replaces previous
        * `allow_multiple` - Allow multiple
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          type: string
          readOnly: true
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        vacancy_ids: {}
        allow_any_email:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
      - status
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          $ref: '#/components/schemas/RoleEnum'
        vacancy_ids:
          type: array
          items:
            type: string
            format: uuid
        allow_any_email:
          type: boolean
          default: false
      required:
      - email
      - role
    InvitationPublic:
      type: object
      description: What an invitee sees before signing in (no token, partially masked
        email).
      properties:
        organisation_name:
          type: string
        organisation_slug:
          type: string
        role:
          type: string
        email_hint:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - email_hint
      - expires_at
      - organisation_name
      - organisation_slug
      - role
      - status
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 2
        workplace_type_default:
          $ref: '#/components/schemas/WorkplaceTypeDefaultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    LocationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        city:
          type: string
          maxLength: 100
        country:
          type: string
          minLength: 1
          maxLength: 2
        workplace_type_default:
          $ref: '#/components/schemas/WorkplaceTypeDefaultEnum'
      required:
      - name
    LogoUploadRequest:
      type: object
      properties:
        logo:
          type: string
          format: binary
      required:
      - logo
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        preferred_name:
          type: string
          maxLength: 150
        display_name:
          type: string
          readOnly: true
        phone_e164:
          type: string
          maxLength: 20
        locale:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 64
        platform_role:
          allOf:
          - $ref: '#/components/schemas/PlatformRoleEnum'
          readOnly: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MeMembership'
          readOnly: true
        active_organisation_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        mfa:
          allOf:
          - $ref: '#/components/schemas/MfaStatus'
          readOnly: true
        candidate_profile_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
      required:
      - active_organisation_id
      - candidate_profile_id
      - display_name
      - email
      - email_verified
      - id
      - memberships
      - mfa
      - platform_role
    MeMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        organisation_slug:
          type: string
        organisation_status:
          type: string
        role:
          type: string
      required:
      - id
      - organisation_id
      - organisation_name
      - organisation_slug
      - organisation_status
      - role
    MemberUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - email
      - id
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organisation_id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          $ref: '#/components/schemas/MembershipStatusEnum'
        joined_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
          nullable: true
        mfa_enabled:
          type: boolean
          readOnly: true
      required:
      - id
      - mfa_enabled
      - organisation_id
      - role
      - user
    MembershipStatusEnum:
      enum:
      - active
      - deactivated
      type: string
      description: |-
        * `active` - Active
        * `deactivated` - Deactivated
    MfaStatus:
      type: object
      properties:
        required:
          type: boolean
        enabled:
          type: boolean
        grace_deadline:
          type: string
