components:
  schemas:
    ActiveOrg:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
        role:
          type: string
      required:
      - organisation_id
      - role
    ActiveOrgRequest:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
      required:
      - organisation_id
    AnswerItemRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 60
        value:
          nullable: true
      required:
      - key
      - value
    AnswersRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerItemRequest'
      required:
      - answers
    ApiRoot:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - name
      - server_time
      - version
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        job:
          allOf:
          - $ref: '#/components/schemas/JobBrief'
          readOnly: true
        contact:
          readOnly: true
          description: Wizard step 1 (draft only).
        last_step:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        lock_version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - contact
      - created_at
      - id
      - job
      - last_step
      - lock_version
      - reference
      - status
      - submitted_at
      - updated_at
      - withdrawn_at
    ApplicationDocumentRoleEnum:
      enum:
      - cv
      - cover_letter
      - certificate
      - transcript
      - portfolio
      - other
      type: string
      description: |-
        * `cv` - CV
        * `cover_letter` - Cover letter
        * `certificate` - Certificate
        * `transcript` - Transcript
        * `portfolio` - Portfolio
        * `other` - Other
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - processing
      - processing_error
      - needs_information
      - under_review
      - on_hold
      - shortlisted
      - interview
      - offer
      - hired
      - not_selected
      - withdrawn
      - offer_declined
      - abandoned
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `processing` - Processing
        * `processing_error` - Processing problem
        * `needs_information` - Clarification requested
        * `under_review` - Under review
        * `on_hold` - On hold
        * `shortlisted` - Shortlisted
        * `interview` - Interview
        * `offer` - Offer
        * `hired` - Hired
        * `not_selected` - Not selected
        * `withdrawn` - Withdrawn
        * `offer_declined` - Offer declined
        * `abandoned` - Abandoned
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership:
          type: string
          format: uuid
          readOnly: true
        role_on_job:
          allOf:
          - $ref: '#/components/schemas/RoleOnJobEnum'
          readOnly: true
        user_name:
          type: string
          readOnly: true
        org_role:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - membership
      - org_role
      - role_on_job
      - user_name
    AssignmentInputRequest:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
        role_on_job:
          $ref: '#/components/schemas/RoleOnJobEnum'
      required:
      - membership_id
      - role_on_job
    AssignmentsInputRequest:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentInputRequest'
      required:
      - assignments
    AttachItemRequest:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/ApplicationDocumentRoleEnum'
        required_doc_key:
          type: string
          maxLength: 40
      required:
      - document_id
      - role
    AttachRequest:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AttachItemRequest'
      required:
      - documents
    AttachedDocument:
      type: object
      properties:
        document:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/ApplicationDocumentRoleEnum'
          readOnly: true
        required_doc_key:
          type: string
          readOnly: true
        filename:
          type: string
          readOnly: true
        scan_status:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
      required:
      - document
      - filename
      - required_doc_key
      - role
      - scan_status
      - size_bytes
    AvailabilityEnum:
      enum:
      - immediate
      - notice
      - not_looking
      type: string
      description: |-
        * `immediate` - Immediately
        * `notice` - After my notice period
        * `not_looking` - Not actively looking
    BlankEnum:
      enum:
      - ''
    CandidateSkill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        skill:
          type: string
          format: uuid
          nullable: true
        raw_name:
          type: string
          maxLength: 150
        proficiency:
          oneOf:
          - $ref: '#/components/schemas/CandidateSkillProficiencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        order:
          type: integer
          maximum: 32767
          minimum: 0
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
      required:
      - id
      - raw_name
      - source
    CandidateSkillProficiencyEnum:
      enum:
      - beginner
      - intermediate
      - advanced
      - expert
      type: string
      description: |-
        * `beginner` - Beginner
        * `intermediate` - Intermediate
        * `advanced` - Advanced
        * `expert` - Expert
    CandidateSkillRequest:
      type: object
      properties:
        skill:
          type: string
          format: uuid
          nullable: true
        raw_name:
          type: string
          minLength: 1
          maxLength: 150
        proficiency:
          oneOf:
          - $ref: '#/components/schemas/CandidateSkillProficiencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        years:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
        order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - raw_name
    CategoryEnum:
      enum:
      - software_it
      - finance
      - engineering
      - health
      - sales_marketing
      - logistics
      - education
      - agriculture
      - mining
      - ngo
      - business
      - legal
      - language
      - general
      type: string
      description: |-
        * `software_it` - Software & IT
        * `finance` - Finance & accounting
        * `engineering` - Engineering
        * `health` - Health
        * `sales_marketing` - Sales & marketing
        * `logistics` - Logistics & supply chain
        * `education` - Education
        * `agriculture` - Agriculture
        * `mining` - Mining
        * `ngo` - NGO & development
        * `business` - Business, HR & administration
        * `legal` - Legal
        * `language` - Languages
        * `general` - General & soft skills
    Certification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        body:
          type: string
          format: uuid
          nullable: true
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        credential_id:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 32767
          minimum: 0
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
      required:
      - id
      - name
      - source
    CertificationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          format: uuid
          nullable: true
        issued_at:
          type: string
          format: date
          nullable: true
        expires_at:
          type: string
          format: date
          nullable: true
        credential_id:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - name
    CommentRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000
    ContactRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        preferred_name:
          type: string
          maxLength: 150
