openapi: 3.0.3
info:
  title: MUDHOTECH HR RECRUITING SYSTEM API
  version: 1.0.0
  description: Multi-tenant ATS with explainable, human-controlled AI screening.
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Public API metadata including the authoritative server time (EC-OPS-06).
      summary: API metadata
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
  /api/v1/csrf/:
    get:
      operationId: auth_csrf
      description: Sets `csrftoken` (readable by JS) so the SPA can send `X-CSRFToken`
        on unsafe requests.
      summary: Set the CSRF cookie for the browser client
      tags:
      - csrf
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/me/active-org/:
    post:
      operationId: me_active_org_set
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrgRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveOrgRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActiveOrgRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveOrg'
          description: ''
  /api/v1/me/sessions/:
    get:
      operationId: me_sessions_list
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/me/sessions/{session_id}/:
    delete:
      operationId: me_sessions_revoke
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/me/sessions/revoke-others/:
    post:
      operationId: me_sessions_revoke_others
      description: '''Log out all other devices''.'
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessions'
          description: ''
components:
  schemas:
    ActiveOrg:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
        role:
          type: string
      required:
      - organisation_id
      - role
    ActiveOrgRequest:
      type: object
      properties:
        organisation_id:
          type: string
          format: uuid
      required:
      - organisation_id
    ApiRoot:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        server_time:
          type: string
          format: date-time
      required:
      - name
      - server_time
      - version
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    RevokedSessions:
      type: object
      properties:
        revoked:
          type: integer
      required:
      - revoked
    UserSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        ip:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - ip
      - is_current
      - last_seen_at
      - user_agent
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
