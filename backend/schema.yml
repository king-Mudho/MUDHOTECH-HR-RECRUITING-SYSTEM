    PlatformRoleEnum:
      enum:
      - none
      - platform_admin
      - platform_support
      type: string
      description: |-
        * `none` - None
        * `platform_admin` - Platform admin
        * `platform_support` - Platform support
    PlatformSuspendReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 1000
      required:
      - reason
    Policy:
      type: object
      properties:
        version:
          type: integer
          readOnly: true
          description: Optimistic lock (lock_version).
        privacy_notice:
          type: string
        retention_months:
          type: integer
          maximum: 32767
          minimum: 0
        duplicate_policy:
          $ref: '#/components/schemas/DuplicatePolicyEnum'
        shortlist_dual_control:
          type: boolean
        rubric_dual_control:
          type: boolean
        ai_enabled:
          type: boolean
        llm_enabled:
          type: boolean
        blind_review_default:
          type: boolean
        notification_delay_minutes:
          type: integer
          maximum: 32767
          minimum: 0
        hide_ai_from_panelists:
          type: boolean
        rights_request_sla_days:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - version
    PublicCompany:
      type: object
      properties:
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Sanitised HTML.
        industry:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 2
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        logo_url:
          type: string
          nullable: true
          readOnly: true
        size_band:
          oneOf:
          - $ref: '#/components/schemas/SizeBandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        open_jobs:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - logo_url
      - name
      - open_jobs
      - slug
    RequiredReasonRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
      required:
      - reason
    RevokedSessions:
      type: object
      properties:
        revoked:
          type: integer
      required:
      - revoked
    RoleEnum:
      enum:
      - org_admin
      - hr_manager
      - recruiter
      - hiring_manager
      - panelist
      - auditor
      type: string
      description: |-
        * `org_admin` - Company admin
        * `hr_manager` - HR manager
        * `recruiter` - Recruiter
        * `hiring_manager` - Hiring manager
        * `panelist` - Interview panel member
        * `auditor` - Auditor
    SizeBandEnum:
      enum:
      - 1-9
      - 10-49
      - 50-249
      - 250-999
      - 1000+
      type: string
      description: |-
        * `1-9` - 1-9
        * `10-49` - 10-49
        * `50-249` - 50-249
        * `250-999` - 250-999
        * `1000+` - 1000+
    UserSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        ip:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
      required:
      - created_at
      - id
      - ip
      - is_current
      - last_seen_at
      - user_agent
    WorkplaceTypeDefaultEnum:
      enum:
      - on_site
      - hybrid
      - remote
      type: string
      description: |-
        * `on_site` - On-site
        * `hybrid` - Hybrid
        * `remote` - Remote
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
