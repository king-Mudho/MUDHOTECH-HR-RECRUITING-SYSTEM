          allOf:
          - $ref: '#/components/schemas/OrganisationStatusEnum'
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        logo_key:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        my_role:
          type: string
          nullable: true
          readOnly: true
        logo_url:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          maxLength: 200
        legal_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        industry:
          type: string
          maxLength: 100
        size_band:
          oneOf:
          - $ref: '#/components/schemas/SizeBandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        country:
          type: string
          maxLength: 2
        city:
          type: string
          maxLength: 100
        address:
          type: string
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        description:
          type: string
          description: Sanitised HTML.
        default_timezone:
          type: string
          maxLength: 64
        default_currency:
          type: string
          maxLength: 3
      required:
      - created_at
      - id
      - logo_key
      - logo_url
      - my_role
      - name
      - slug
      - status
      - verified_at
    OrganisationCreateRequest:
