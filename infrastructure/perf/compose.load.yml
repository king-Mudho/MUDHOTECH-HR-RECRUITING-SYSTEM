# Load tests (P10-T05): serve the API the way production does (gunicorn + uvicorn workers,
# docker/entrypoint-prod.sh flags) instead of Django's development server, which is single-process
# and would only measure itself. Use with:
#   docker compose -f docker-compose.yml -f infrastructure/perf/compose.load.yml up -d ...
services:
  backend:
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn config.asgi:application --worker-class uvicorn.workers.UvicornWorker
        --bind 0.0.0.0:8000 --workers 4 --timeout 60 --graceful-timeout 30
        --max-requests 2000 --max-requests-jitter 200
