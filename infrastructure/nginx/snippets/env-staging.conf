# Staging: synthetic data only, never indexed by search engines.
add_header X-Robots-Tag "noindex, nofollow" always;

# Mailpit (compose profile `staging`) catches every staging email; the staging E2E workflow reads verification
# links through its API. Basic auth only (GitHub runners have no fixed IP): /etc/mhrs/nginx/mailpit.htpasswd,
# empty by default = nobody gets in. Production has no such location (the path falls through to the frontend 404).
location ^~ /mailpit/ {
  auth_basic "MHRS staging mail";
  auth_basic_user_file /etc/nginx/local/mailpit.htpasswd;
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $mhrs_mailpit http://mailpit:8025;
  # reviewed: not `internal` on purpose - the staging E2E job reaches Mailpit from GitHub runners, behind basic auth
  proxy_pass $mhrs_mailpit;  # nosemgrep: generic.nginx.security.missing-internal.missing-internal
  include /etc/nginx/snippets/proxy.conf;
}
