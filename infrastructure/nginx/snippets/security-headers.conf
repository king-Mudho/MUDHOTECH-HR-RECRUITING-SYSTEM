# Headers nginx owns. CSP, frame, referrer, permissions and COOP headers come from the applications
# (frontend/next.config.ts, backend apps/core/security_headers.py) so they are tested with the code.
# `add_header` in a location replaces inherited ones, so locations that add headers include this again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Request-ID $request_id always;
