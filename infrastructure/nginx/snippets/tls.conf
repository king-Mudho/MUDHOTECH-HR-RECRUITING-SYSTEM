# TLS 1.2+ (Mozilla "intermediate"), certificates from Let's Encrypt (infrastructure/deployment/certbot.sh).
# ${MHRS_DOMAIN} is not available in snippets (only templates are rendered), so the certificate lives
# under the fixed lineage name `mhrs` (certbot --cert-name mhrs).
ssl_certificate     /etc/letsencrypt/live/mhrs/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mhrs/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
# forward-secret AEAD suites only (no DHE: no custom dhparam to maintain)
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:MHRS_TLS:10m;
ssl_session_tickets off;

# no OCSP stapling: Let's Encrypt stopped running OCSP responders in 2025 (revocation via CRLs)
