# Common reverse-proxy settings. The backend trusts X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER) and is
# reachable only through nginx, so these headers cannot be forged by clients.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
# the apps send their own security headers; nginx sets HSTS/nosniff once (security-headers.conf)
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Powered-By;
