# Single source of truth for where MHRS lives on the shared VPS (66.29.139.201).
# Sourced by every script in infrastructure/vps/. Shell syntax; no secrets belong here.
#
# The server already runs four stacks. Every value below differs from all of them:
#
#   app                                   user          directory          ports        database
#   ABI (agribizframework.com)            agribiz       /srv/agribiz       8000 / 3000  agribiz_prod
#   DRP (research.agribizframework.com)   agribiz-drp   /srv/agribiz-drp   8100 / 3100  drp_prod
#   mudhotech.com                         (own)         /srv/mudhotech     8200 / 3200  (own)
#   AMA (ama.agribizframework.com)        agribiz-ama   /srv/agribiz-ama   8300 / 3300  ama_prod
#   MHRS (hr.agribizframework.com)        mhrs          /srv/mhrs          8400 / 3400  mhrs_prod
#
# MHRS also runs private helpers, all bound to 127.0.0.1 only:
#   SeaweedFS S3 8533 (master 9533, volume 8580, filer 8588; gRPC = port + 10000)
#   ClamAV daemon 3410
#   Redis databases 5 (queues) and 6 (cache) on the shared Redis (the other apps use 0)
#
# The ports are also written in the systemd units and the nginx template: change them together.

SITE_DOMAIN="${SITE_DOMAIN:-hr.agribizframework.com}"
SERVER_IP="${SERVER_IP:-66.29.139.201}"

APP_USER="mhrs"
APP_DIR="/srv/mhrs"
BACKEND="$APP_DIR/backend"
FRONTEND="$APP_DIR/frontend"
BACKUP_DIR="$APP_DIR/backups"
S3_DATA_DIR="$APP_DIR/s3-data"
HF_HOME_DIR="$APP_DIR/hf-cache"
TOOLS_DIR="$APP_DIR/tools"
NODE_DIR="$TOOLS_DIR/node"
RUN_DIR="$APP_DIR/run"

DB_NAME="mhrs_prod"
DB_USER="mhrs_app"

BACKEND_PORT=8400
FRONTEND_PORT=3400
S3_PORT=8533
CLAMD_PORT=3410
REDIS_QUEUE_DB=5
REDIS_CACHE_DB=6

SERVICES=(mhrs-s3 mhrs-clamd mhrs-backend mhrs-worker mhrs-beat mhrs-frontend)
NGINX_CONF="/etc/nginx/conf.d/hr.agribizframework.conf"

PYTHON="python3.12"
NODE_VERSION="24.22.3"
UV_VERSION="0.13.9"
SEAWEEDFS_VERSION="4.50"
EMBEDDING_MODEL="sentence-transformers/all-MiniLM-L6-v2"
