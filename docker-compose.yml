# MUDHOTECH HR RECRUITING SYSTEM - local development stack (docs/10 §1).
# The repository path contains spaces, so the project name is set explicitly.
name: mhrs

x-backend-env: &backend-env
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
    DATABASE_URL: ${DATABASE_URL:-postgres://mhrs:mhrs@postgres:5432/mhrs}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:9000}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    EMAIL_URL: ${EMAIL_URL:-smtp://mailpit:1025}
    CLAMAV_HOST: ${CLAMAV_HOST:-clamav}

x-backend-common: &backend-common
  <<: *backend-env
  image: mhrs-backend:dev
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
    - ./backend:/app
    - backend-venv-cache:/home/app/.cache
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully

x-worker-common: &worker-common
  <<: *backend-common
  image: mhrs-worker:dev
  build:
    context: ./backend
    dockerfile: Dockerfile.worker
  healthcheck:
    test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10 | grep -q \"@$$(hostname): OK\""]
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mhrs
      POSTGRES_USER: mhrs
      POSTGRES_PASSWORD: mhrs
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhrs -d mhrs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev-only S3-compatible object store (ADR-021: MinIO images are no longer publicly pullable).
  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=0"]
    ports:
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_FILER_HOST_PORT:-8888}:8888"
    volumes:
      - s3-data:/data
      - ./infrastructure/docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/healthz >/dev/null 2>&1 || wget -qO- http://127.0.0.1:9000/ 2>&1 | grep -qi -e error -e bucket"]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-mhrs-s3-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-mhrs-s3-dev-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-af-south-1}
    entrypoint: ["/bin/sh", "/init/s3-init.sh"]
    volumes:
      - ./infrastructure/docker/s3:/init:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s
    profiles: ["full", "clamav"]

  backend:
    <<: *backend-common
    command: ["sh", "/app/docker/entrypoint-dev.sh"]
    environment:
      RUNSERVER_ARGS: ${RUNSERVER_ARGS:-}
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker-default:
    <<: *worker-common
    command: ["celery", "-A", "config", "worker", "-Q", "default,notifications,reports", "-c", "2", "-n", "default@%h", "-l", "info"]

  worker-documents:
    <<: *worker-common
    command: ["celery", "-A", "config", "worker", "-Q", "documents", "-c", "2", "-n", "documents@%h", "-l", "info"]

  worker-ai:
    <<: *worker-common
    command: ["celery", "-A", "config", "worker", "-Q", "ai", "-c", "1", "-n", "ai@%h", "-l", "info"]

  beat:
    <<: *backend-common
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  flower:
    <<: *backend-common
    command: ["celery", "-A", "config", "flower", "--port=5555"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  s3-data:
  clamav-data:
  backend-venv-cache:
  frontend-node-modules:
  frontend-next:
