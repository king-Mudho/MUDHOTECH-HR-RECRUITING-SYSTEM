# Nightly: full E2E + accessibility, security scans, AI benchmarks (skeleton - extended per phase).
name: Nightly

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 03:00 Africa/Harare
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright + axe) on docker compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait postgres redis s3 s3-init mailpit backend worker-default frontend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/readyz && break; sleep 5; done
          curl -fsS http://localhost:8000/readyz
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log && tail -n 300 compose.log

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Bandit + pip-audit
        working-directory: backend
        run: |
          uv sync --frozen
          uv run bandit -r apps ai_engine config -x "*/tests/*,*/migrations/*"
          uv export --frozen --no-hashes --no-dev > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
      - name: Semgrep
        run: pipx run semgrep scan --config auto --error --exclude frontend/node_modules
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  clamd:
    name: Antivirus integration (real ClamAV, EICAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Wait for clamd (signature download can take minutes)
        run: |
          for i in $(seq 1 60); do (printf 'zPING\0' | nc -w 2 localhost 3310 | grep -q PONG) && break; sleep 10; done
      - name: EICAR test
        working-directory: backend
        env:
          CLAMD_INTEGRATION: "1"
          CLAMAV_HOST: localhost
          CLAMAV_PORT: "3310"
        run: |
          uv sync --frozen
          uv run pytest -q apps/documents/tests/test_scan_pipeline.py -k real_clamd -p no:cacheprovider

  ai-benchmark:
    name: AI benchmarks (enabled from Phase 06)
    runs-on: ubuntu-24.04
    if: ${{ false }}
    steps:
      - run: echo "Benchmark harness added in P06-T15"
