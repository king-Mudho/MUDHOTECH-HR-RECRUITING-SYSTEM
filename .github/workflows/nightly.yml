# Nightly: full E2E + accessibility, security scans, AI benchmarks (skeleton - extended per phase).
name: Nightly

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 03:00 Africa/Harare
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright + axe) on docker compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start backend stack
        # beat relays the outbox (emails), workers run the queues; the frontend runs as a
        # production build on the runner below (dev-mode compiles are too slow for E2E).
        run: |
          cp .env.example .env
          # No --wait: s3-init is a one-shot that exits by design (some Compose versions treat that as
          # a failure). It still runs first as backend's dependency; readiness is polled below.
          docker compose up -d --build postgres redis s3 mailpit backend worker-default worker-documents worker-ai beat
      - name: Wait for readiness and seed demo data
        run: |
          for i in $(seq 1 90); do curl -fsS http://localhost:8000/readyz && break; sleep 5; done
          curl -fsS http://localhost:8000/readyz || (docker compose ps -a; docker compose logs --no-color --tail 200; exit 1)
          test "$(docker compose ps -a --format '{{.ExitCode}}' s3-init)" = "0"
          docker compose exec -T backend python manage.py seed_demo
          # P08-T13 core scenario: 100 synthetic applications, 1-minute notification delay
          docker compose exec -T backend python manage.py seed_core_scenario --count 100 --delay-minutes 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and start the frontend
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run start > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
      - name: Playwright
        working-directory: frontend
        run: |
          export DEMO_PASSWORD="$(grep '^DEMO_PASSWORD=' ../.env | cut -d= -f2-)"
          npx playwright install --with-deps chromium
          npx playwright test
      - name: OWASP ZAP baseline (passive scan of the running stack, P09-T09)
        if: always()
        run: |
          mkdir -p zap && chmod 777 zap
          cp infrastructure/security/zap-rules.tsv zap/  # step runs from the repository root
          # -I: warnings are reported, only rules marked FAIL in zap-rules.tsv fail the job
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t http://127.0.0.1:3000 -c zap-rules.tsv -r zap-report.html -I
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens
          path: frontend/test-results/screens
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > compose.log && tail -n 300 compose.log
          tail -n 100 /tmp/frontend.log || true

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Bandit + pip-audit
        working-directory: backend
        run: |
          uv sync --frozen
          uv run bandit -r apps ai_engine config -x "*/tests/*,*/migrations/*"
          uv export --frozen --no-hashes --no-dev > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt
      - name: Semgrep (default, Django, React, TypeScript, secrets rulesets)
        # findings are reported as annotations (readable without the logs), then fail the step
        run: |
          pipx run semgrep scan --metrics=off             --config p/default --config p/django --config p/react --config p/typescript --config p/secrets             --exclude frontend/node_modules --exclude "*.txt" --json -o semgrep.json || true
          python3 scripts/semgrep_annotations.py semgrep.json
      - name: detect-secrets (no new secrets against the committed baseline)
        working-directory: backend
        run: |
          cd ..
          FILES=$(git ls-files -- ':!*.lock' ':!frontend/package-lock.json')
          # the first run may only refresh line numbers of known entries (and exit non-zero); a
          # genuinely new secret fails the second run too
          uv run --project backend detect-secrets-hook --baseline .secrets.baseline $FILES             || uv run --project backend detect-secrets-hook --baseline .secrets.baseline $FILES
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build images for scanning
        run: |
          docker build -t mhrs-backend:scan backend
          docker build -t mhrs-frontend:scan frontend
      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mhrs-backend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: mhrs-frontend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  clamd:
    name: Antivirus integration (real ClamAV, EICAR)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
      # the scan-pipeline test module uses the database (pytest-django), like the CI job
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mhrs
          POSTGRES_USER: mhrs
          POSTGRES_PASSWORD: mhrs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mhrs -d mhrs" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Wait for clamd (signature download can take minutes)
        run: |
          for i in $(seq 1 60); do (printf 'zPING\0' | nc -w 2 localhost 3310 | grep -q PONG) && break; sleep 10; done
      - name: EICAR test
        working-directory: backend
        env:
          CLAMD_INTEGRATION: "1"
          CLAMAV_HOST: localhost
          CLAMAV_PORT: "3310"
          DATABASE_URL: postgres://mhrs:mhrs@localhost:5432/mhrs
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv sync --frozen
          uv run pytest -q --create-db apps/documents/tests/test_scan_pipeline.py -k real_clamd -p no:cacheprovider -rs

  ai-benchmark:
    name: AI benchmarks (extraction, docs/09 §5)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the worker image (Tesseract + local embedding model)
        run: docker build -f backend/Dockerfile.worker -t mhrs-worker:bench backend
      - name: Extraction benchmark (fails when a target is missed)
        run: |
          mkdir -p reports && chmod 777 reports  # the image runs as a non-root user
          docker run --rm -v "$PWD/backend:/app" -v "$PWD/reports:/reports" mhrs-worker:bench             python -m ai_engine.tests.benchmark.run_extraction_benchmark               --out-dir /reports --workers 2 --semantic --check
      - name: Screening benchmark (recall, grounding, determinism, counterfactual; P07-T15)
        if: always()
        run: >-
          docker run --rm -v "$PWD/backend:/app" -v "$PWD/scripts:/scripts:ro"
          -v "$PWD/reports:/reports" mhrs-worker:bench
          python -m ai_engine.tests.benchmark.run_screening_benchmark --out-dir /reports --check
      - name: Fairness benchmark (>= 500 perturbations must be identical; P10-T04)
        if: always()
        run: >-
          docker run --rm -v "$PWD/backend:/app" -v "$PWD/scripts:/scripts:ro"
          -v "$PWD/reports:/reports" mhrs-worker:bench
          python -m ai_engine.tests.benchmark.run_fairness_benchmark --out-dir /reports --check
      - name: Calibration sweep (corpus + vacancy rubrics; P10-T03, informational)
        if: always()
        run: >-
          docker run --rm -v "$PWD/backend:/app" -v "$PWD/reports:/reports" mhrs-worker:bench
          python -m ai_engine.tests.benchmark.calibrate --semantic --listed 50,75
          --extraction-thresholds 0.60,0.65,0.75 --out-dir /reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extraction-benchmark
          path: reports/
