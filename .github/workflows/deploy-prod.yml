# Production (ADR-033): a version tag (vX.Y.Z) deploys that commit to the shared VPS
# (https://hr.agribizframework.com) after CI passed for it and the owner approved.
#
# The workflow builds a `git archive` of the tagged commit (committed files only: no .env or data),
# waits for approval in the "production" environment, then streams the archive over SSH to the
# server, where the deploy key is pinned to infrastructure/vps/ci-deploy.sh (no shell): it checks the
# archive, unpacks it into /srv/mhrs and runs deploy.sh (backup, migrations, build, restart, checks).
#
# Owner setup (GitHub -> Settings -> Environments -> "production"): required reviewer (the owner),
# deployment tag rule `v*`, variable PROD_URL=https://hr.agribizframework.com and secrets
# PROD_HOST (66.29.139.201), PROD_SSH_KEY (private deploy key), PROD_SSH_KNOWN_HOSTS (ssh-keyscan
# line). See infrastructure/vps/README.md "Releases from GitHub".
# Releasing:  git tag -a v1.2.0 -m "v1.2.0" && git push origin v1.2.0
# Rollback:   run this workflow manually with the previous tag (schema changes are expand-only).
name: Deploy (production)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v1.2.0); rollback = deploy the previous tag"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    name: Check CI and build the release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ $INPUT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a release tag: $INPUT_TAG"; exit 1; }
          {
            echo "tag=$INPUT_TAG"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
      - name: CI must have passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.meta.outputs.sha }}
        # filter by conclusion here: the API's status=success filter lags behind for fresh runs
        run: |
          for attempt in 1 2 3 4 5 6; do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            [ "${ok:-0}" -gt 0 ] && { echo "CI passed for $SHA"; exit 0; }
            echo "no successful CI run found yet (attempt $attempt); waiting 30 s"
            sleep 30
          done
          echo "::error title=CI not green::no successful CI run for $SHA - push to main and wait for CI first"
          exit 1
      - name: Build the release archive (committed files only)
        run: git archive --format=tar.gz -o mhrs-release.tar.gz HEAD && ls -l mhrs-release.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhrs-release-${{ steps.meta.outputs.tag }}
          path: mhrs-release.tar.gz
          retention-days: 30

  deploy:
    name: Deploy to hr.agribizframework.com
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      HOST: ${{ secrets.PROD_HOST }}
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Production configured?
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error title=Production not configured::PROD_HOST / PROD_SSH_KEY / PROD_SSH_KNOWN_HOSTS are missing (owner step, infrastructure/vps/README.md)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Rebuild the same release archive (git archive is deterministic for a commit)
        run: git archive --format=tar.gz -o mhrs-release.tar.gz HEAD
      - name: Stream the release to the server and deploy
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$HOST" "deploy $TAG" < mhrs-release.tar.gz
      - name: Check the live site
        run: |
          for path in /readyz / /jobs /api/v1/jobs/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://hr.agribizframework.com$path")
            echo "$code $path"; [ "$code" = 200 ] || exit 1
          done
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy
