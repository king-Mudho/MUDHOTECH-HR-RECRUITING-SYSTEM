# MUDHOTECH HR RECRUITING SYSTEM - CI (docs/09 §6)
name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  UV_VERSION: "0.13.7"

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mhrs
          POSTGRES_USER: mhrs
          POSTGRES_PASSWORD: mhrs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mhrs -d mhrs" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://mhrs:mhrs@localhost:5432/mhrs
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ruff check ../scripts
          uv run ruff format --check ../scripts
      - name: Mypy
        run: uv run mypy apps ai_engine
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: uv run pytest -q --create-db --cov=apps --cov=ai_engine --cov-report=xml --cov-report=term --cov-fail-under=80
      - name: Edge-case coverage (completed phases)
        run: python ../scripts/ec_coverage.py
      - name: Bandit (security lint)
        run: uv run bandit -q -r apps ai_engine config -x "*/tests/*,*/migrations/*" -ll
      - name: pip-audit (dependency vulnerabilities)
        run: uv export --frozen --no-hashes --no-dev > /tmp/requirements.txt && uv run pip-audit -r /tmp/requirements.txt --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  contract:
    name: API contract (schema drift + generated types)
    runs-on: ubuntu-24.04
    needs: [backend]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate OpenAPI schema
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py spectacular --file schema.yml --validate --fail-on-warn
      - name: Schema must be committed
        run: git diff --exit-code -- backend/schema.yml || (echo "::error::backend/schema.yml is out of date - run 'python manage.py spectacular --file schema.yml' and commit." && exit 1)
      - name: Generate TS types and typecheck
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
          git diff --exit-code -- src/types/api.d.ts || (echo "::error::frontend/src/types/api.d.ts is out of date - run 'npm run gen:api' and commit." && exit 1)
          npm run typecheck

  images:
    name: Build images
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          build-args: UV_SYNC_ARGS=--frozen --no-install-project --no-dev
          tags: mhrs-backend:ci
          load: true
      - name: Build worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: false
          build-args: UV_SYNC_ARGS=--frozen --no-install-project --no-dev
          tags: mhrs-worker:ci
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          target: runtime
          push: false
          tags: mhrs-frontend:ci
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mhrs-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
